<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPFS File Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
    }

    .file-list {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .file-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .file-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-name {
      font-weight: 600;
    }

    .status-tag {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .status-tag.downloaded {
      color: #4ade80;
    }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #viewer {
      margin-top: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: none;
    }

    #viewer iframe, #viewer img {
      width: 100%;
      max-height: 500px;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>Hosted Files (OPFS Storage)</h1>
  <div class="file-list" id="fileList"></div>

  <div id="viewer">
    <h3 id="viewerTitle">File Preview</h3>
    <div id="viewerContent"></div>
  </div>

  <script>
    // Define the list of files hosted on your GitHub repository
    const filesToHost = [
      { name: "sample.pdf", url: "files/sample.pdf", type: "pdf" },
      { name: "image.png", url: "files/image.png", type: "image" },
      { name: "notes.txt", url: "files/notes.txt", type: "text" }
    ];

    let opfsRoot = null;

    // Initialize OPFS
    async function initOPFS() {
      if ('storage' in navigator && 'getDirectory' in navigator.storage) {
        opfsRoot = await navigator.storage.getDirectory();
        renderFileList();
      } else {
        alert("Your browser does not support OPFS (Origin Private File System).");
      }
    }

    // Check if a file already exists in OPFS
    async function isFileInOPFS(fileName) {
      try {
        await opfsRoot.getFileHandle(fileName, { create: false });
        return true;
      } catch (e) {
        return false;
      }
    }

    // Save a Blob into OPFS
    async function saveToOPFS(fileName, blob) {
      const fileHandle = await opfsRoot.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
    }

    // Read a file from OPFS as a Blob
    async function getFromOPFS(fileName) {
      const fileHandle = await opfsRoot.getFileHandle(fileName, { create: false });
      return await fileHandle.getFile();
    }

    // Handle user clicking the button
    async function handleFileAction(file, btnElement, statusElement) {
      const exists = await isFileInOPFS(file.name);

      if (!exists) {
        // Download from GitHub host and store in OPFS
        btnElement.innerText = "Downloading...";
        btnElement.disabled = true;

        try {
          const response = await fetch(file.url);
          if (!response.ok) throw new Error("Network error");

          const blob = await response.blob();
          await saveToOPFS(file.name, blob);

          statusElement.innerText = "Downloaded in OPFS";
          statusElement.classList.add("downloaded");
          btnElement.innerText = "View File";
          btnElement.disabled = false;
        } catch (err) {
          alert("Failed to download file: " + err.message);
          btnElement.innerText = "Download & Open";
          btnElement.disabled = false;
        }
      } else {
        // Render existing file from OPFS
        displayFile(file.name);
      }
    }

    // Display the file in the preview pane using an Object URL
    async function displayFile(fileName) {
      const fileBlob = await getFromOPFS(fileName);
      const fileUrl = URL.createObjectURL(fileBlob);

      const viewer = document.getElementById("viewer");
      const viewerTitle = document.getElementById("viewerTitle");
      const viewerContent = document.getElementById("viewerContent");

      viewerTitle.innerText = `Viewing: ${fileName}`;
      viewerContent.innerHTML = "";

      if (fileBlob.type.includes("image") || fileName.match(/\.(png|jpe?g|gif|webp)$/i)) {
        const img = document.createElement("img");
        img.src = fileUrl;
        viewerContent.appendChild(img);
      } else {
        const iframe = document.createElement("iframe");
        iframe.src = fileUrl;
        viewerContent.appendChild(iframe);
      }

      viewer.style.display = "block";
    }

    // Render the file list UI dynamically
    async function renderFileList() {
      const listContainer = document.getElementById("fileList");
      listContainer.innerHTML = "";

      for (const file of filesToHost) {
        const isDownloaded = await isFileInOPFS(file.name);

        const card = document.createElement("div");
        card.className = "file-card";

        const info = document.createElement("div");
        info.className = "file-info";

        const name = document.createElement("div");
        name.className = "file-name";
        name.innerText = file.name;

        const status = document.createElement("div");
        status.className = "status-tag" + (isDownloaded ? " downloaded" : "");
        status.innerText = isDownloaded ? "Downloaded in OPFS" : "Available on Server";

        info.appendChild(name);
        info.appendChild(status);

        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = isDownloaded ? "View File" : "Download & Open";

        btn.onclick = () => handleFileAction(file, btn, status);

        card.appendChild(info);
        card.appendChild(btn);
        listContainer.appendChild(card);
      }
    }

    window.addEventListener("DOMContentLoaded", initOPFS);
  </script>
</body>
</html>
